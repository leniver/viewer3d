[workspace]
members = [".", "crates/occt-step"]

[package]
name = "viewer3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Fast, lightweight viewer for 3D files: glTF/GLB, FBX, OBJ, STL, PLY, 3MF, STEP, IGES"
license = "MIT"
repository = "https://github.com/leniver/viewer3d"
publish = false

[features]
default = ["step"]
# STEP / IGES / BREP through OpenCASCADE (long first build; needs CMake and a C++ compiler).
step = ["dep:occt-step"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit", "persistence"] }
# Same egui as eframe's; only adds the monochrome emoji fonts used for toolbar icons.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["names", "extensions", "KHR_texture_transform", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_materials_pbrSpecularGlossiness", "allow_empty_texture"] }
base64 = "0.22"
ufbx = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "gif", "webp", "tiff", "dds", "rayon"] }
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }
rayon = "1.12"
rfd = "0.18"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
serde = { version = "1", features = ["derive"] }
pollster = "0.4"
occt-step = { path = "crates/occt-step", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

# Parsers, image decoders and wgpu are far too slow unoptimised; optimise
# dependencies even in debug builds (compiled once, then cached).
[profile.dev.package."*"]
opt-level = 3
