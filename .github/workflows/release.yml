# Builds the Windows installer and portable zip.
# - Push a v<version> tag (matching Cargo.toml): builds, tests and creates a
#   draft GitHub release with the files, to check and publish by hand.
# - Run manually (Actions > Release > Run workflow): builds the same files as a
#   workflow artifact, without a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    # The first run compiles Open CASCADE (about an hour); later runs reuse it.
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - name: Use every CPU of the runner
        shell: pwsh
        # .cargo/config.toml keeps two CPUs free for desktop builds; the runner
        # is dedicated to this job.
        run: |
          "CARGO_BUILD_JOBS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV
          "OCCT_BUILD_JOBS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'viewer3d').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
          }

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore the Open CASCADE build
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: |
            target/OCCT/include
            target/OCCT/lib
            target/OCCT/*.txt
            target/OCCT/.viewer3d-occt-*
          key: occt-7.8.1-windows-msvc-${{ hashFiles('crates/occt-step/build.rs') }}

      - name: Build
        run: cargo build --release --locked

      # Saved right after the build, so a later failing step does not cost
      # another Open CASCADE compilation.
      - name: Save the Open CASCADE build
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/OCCT/include
            target/OCCT/lib
            target/OCCT/*.txt
            target/OCCT/.viewer3d-occt-*
          key: ${{ steps.occt.outputs.cache-primary-key }}

      - name: Test
        run: cargo test --workspace --locked

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package
        shell: pwsh
        run: ./installer/build.ps1 -SkipBuild

      - name: Upload the files
        uses: actions/upload-artifact@v4
        with:
          name: viewer3d-windows-x64
          path: target/dist/
          if-no-files-found: error

      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem target/dist -File | ForEach-Object FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-run of the workflow: replace the files of the existing release.
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --draft --verify-tag `
              --title "3D Viewer $($tag.TrimStart('v'))" --notes-file target/package/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
